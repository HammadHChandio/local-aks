# TLS ingress through Contour (SAS default ingress controller since cadence 2026.02).
apiVersion: apps/v1
kind: Deployment
metadata: { name: echo, namespace: platform-smoke }
spec:
  replicas: 1
  selector: { matchLabels: { app: echo } }
  template:
    metadata: { labels: { app: echo } }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-text=sas-viya-local-ingress-ok", "-listen=:5678"]
          ports: [{ containerPort: 5678 }]
---
apiVersion: v1
kind: Service
metadata: { name: echo, namespace: platform-smoke }
spec:
  selector: { app: echo }
  ports: [{ port: 80, targetPort: 5678 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: echo, namespace: platform-smoke }
spec:
  ingressClassName: contour
  tls: [{ hosts: [viya.local.test], secretName: echo-tls }]
  rules:
    - host: viya.local.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: echo, port: { number: 80 } } }
