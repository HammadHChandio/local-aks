# Default-deny ingress in the smoke namespace, then allow only from pods labelled role=client.
# k3s ships a NetworkPolicy controller (kube-router), so this is ENFORCED locally (unlike Floci NSGs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: platform-smoke }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-echo-from-clients, namespace: platform-smoke }
spec:
  podSelector: { matchLabels: { app: echo } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { role: client } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: projectcontour } }
